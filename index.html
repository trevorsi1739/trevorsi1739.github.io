<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@catblackdev</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #e7e9ea;
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            background-color: #000000;
        }

        .cover-photo {
            width: 100%;
            height: 180px;
            background-image: url('https://picsum.photos/800/300');
            background-size: cover;
            background-position: center;
        }

        .profile-section {
            padding: 0 16px;
            position: relative;
            margin-bottom: 20px;
        }

        .avatar-wrapper {
            position: relative;
            margin-top: -50px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #202020;
            object-fit: cover;
        }

        .user-info .name {
            font-size: 20px;
            font-weight: 800;
            color: #f7f9f9;
        }

        .user-info .username {
            font-size: 15px;
            color: #71767b;
            margin-top: 2px;
        }

        .user-info .bio {
            font-size: 15px;
            margin-top: 12px;
            line-height: 1.4;
            color: #e7e9ea;
        }

        .feed {
            margin-top: 10px;
        }

        .note-card {
            padding: 16px;
            transition: background-color 0.2s;
        }

        .note-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .note-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #202020;
        }

        .note-user-details {
            display: flex;
            gap: 5px;
            font-size: 15px;
        }

        .note-author {
            font-weight: 700;
            color: #f7f9f9;
        }

        .note-handle, .note-time {
            color: #71767b;
        }

        .note-content {
            font-size: 15px;
            line-height: 1.5;
            color: #e7e9ea;
            margin-left: 50px;
            margin-top: -15px;
        }

        .note-actions {
            display: flex;
            justify-content: space-between;
            max-width: 350px;
            margin-left: 50px;
            margin-top: 12px;
            color: #71767b;
            font-size: 14px;
            pointer-events: none;
            user-select: none;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-item i {
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
      
        <div class="cover-photo"></div>

        <div class="profile-section">
            <div class="avatar-wrapper">
                <img src="https://avatars.githubusercontent.com/u/83536252?v=4" alt="Profil Fotoğrafı" class="avatar">
            </div>
            <div class="user-info">
                <div class="name">CatBlackDev</div>
                <div class="username">@catblackdev</div>
                <div class="bio">
                    Bursa, Türkiye
                </div>
            </div>
        </div>

        <div class="feed">

            <div class="note-card">
                <div class="note-header">
                    <img src="https://avatars.githubusercontent.com/u/83536252?v=4" class="note-avatar" alt="Avatar">
                    <div class="note-user-details">
                        <span class="note-author">CatBlackDev</span>
                        <span class="note-handle">@catblackdev</span>
                        <span class="note-time">• 24 July</span>
                    </div>
                </div>
                <div class="note-content">
                    Programlama işi güzel ama gece hata ararken değil.
                </div>
              
                <div class="note-actions">
                    <div class="action-item">
                        <i class="fa-regular fa-heart"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-regular fa-comment"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-solid fa-retweet"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </div>
                </div>
            </div>
            

            <div class="note-card">
                <div class="note-header">
                    <img src="https://avatars.githubusercontent.com/u/83536252?v=4" class="note-avatar" alt="Avatar">
                    <div class="note-user-details">
                        <span class="note-author">CatBlackDev</span>
                        <span class="note-handle">@catblackdev</span>
                        <span class="note-time">• 22 July</span>
                    </div>
                </div>
                <div class="note-content">
                    Nihayet, RDR2'nin hikayesini bitirdim.
                </div>
              
                <div class="note-actions">
                    <div class="action-item">
                        <i class="fa-regular fa-heart"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-regular fa-comment"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-solid fa-retweet"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </div>
                </div>
            </div>

          
            <div class="note-card">
                <div class="note-header">
                    <img src="https://avatars.githubusercontent.com/u/305893856?v=4" class="note-avatar" alt="Avatar">
                    <div class="note-user-details">
                        <span class="note-author">Mete Dinçer</span>
                        <span class="note-handle">@md</span>
                        <span class="note-time">• 20 July</span>
                    </div>
                </div>
                <div class="note-content">
                    Hello world! 🎉
                </div>
              
                <div class="note-actions">
                    <div class="action-item">
                        <i class="fa-regular fa-heart"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-regular fa-comment"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-solid fa-retweet"></i>
                    </div>
                    <div class="action-item">
                        <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
